[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-guard"
version = "0.2.0"
description = "Open-source, model-agnostic provenance auditing and two-sided listening engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Epistemic Guard Contributors" }
]
keywords = [
    "provenance",
    "fact-checking",
    "epistemics",
    "misinformation",
    "source-tiering",
    "verification"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0.1",
    "tldextract>=5.1",
    "openai>=1.50.0",
    "duckduckgo-search>=6.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "langgraph>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
]

[project.scripts]
epistemic-guard = "epistemic_guard.interfaces.cli:app"
epistemic-guard-mcp = "epistemic_guard.interfaces.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
