name: Publish to PyPI (OIDC Trusted Publishing)

"on":
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite (pytest)
        run: pytest -v --tb=short

  build-and-publish:
    name: Build & Publish provenance-guard to PyPI
    needs: [verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/provenance-guard
    permissions:
      contents: read
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata (twine check)
        run: twine check dist/*

      - name: Publish package distributions to PyPI (OIDC, zero tokens)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
